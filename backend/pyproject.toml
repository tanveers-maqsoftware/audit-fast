[project]
name = "auditfast"
version = "0.2.0"
description = "AuditFAST — read-only Microsoft Fabric auditor (core engine + REST API + MCP server)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "MAQ Software — Fabric Practice" }]

dependencies = [
    "mcp>=1.2.0",
    "msal>=1.31.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]
# Postgres driver — install with `pip install -e ".[postgres]"` for production.
postgres = ["psycopg[binary]>=3.1.0"]

[project.scripts]
auditfast-mcp = "auditfast.mcp.__main__:main"
auditfast-api = "auditfast.api.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auditfast"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
